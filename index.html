<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังข้อสอบเก่า & สรุปเนื้อหา</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>📚 คลังข้อสอบเก่า & สรุปเนื้อหา</h1>
            <p>แหล่งรวมชีทสรุปและแนวข้อสอบสำหรับทบทวนบทเรียน</p>
        </div>
    </header>

    <main class="container">
        <!-- ส่วนค้นหาและตัวกรอง -->
        <section class="controls">
            <input type="text" id="searchInput" placeholder="ค้นหาชื่อวิชา, รหัสวิชา, หรือหัวข้อ...">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
                <button class="filter-btn" data-filter="exam">📝 ข้อสอบเก่า</button>
                <button class="filter-btn" data-filter="summary">📖 ชีทสรุป</button>
            </div>
        </section>

        <!-- พื้นที่แสดงรายการเอกสาร -->
        <section id="resourceGrid" class="grid">
            <!-- การ์ดข้อมูลจะถูกสร้างอัตโนมัติจาก script.js -->
        </section>
    </main>

    <!-- หน้าต่าง Modal สำหรับอ่านสรุปย่อบนเว็บ -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <span id="modalBadge" class="badge"></span>
            <h2 id="modalTitle"></h2>
            <p id="modalSubject" class="subject-tag"></p>
            <div id="modalBody" class="modal-body"></div>
            <div class="modal-footer">
                <a id="modalDownloadBtn" href="#" target="_blank" class="btn-primary">เปิดไฟล์ฉบับเต็ม / ดาวน์โหลด (PDF)</a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 คลังข้อสอบเก่าและสรุปเนื้อหา | อัปเดตล่าสุดเพื่อการเรียนรู้</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
